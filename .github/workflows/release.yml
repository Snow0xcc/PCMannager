name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: lint (emoji 约束)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # 客户端界面禁用 emoji（项目硬约束）：新增前端后必须仍然通过。
      - name: emoji check
        run: bash scripts/check-emoji.sh

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    env:
      # 产物名在 with: 之前就必须是确定的：steps.*.with 在步骤启动前求值，
      # 无法读取 build 步骤写入 $GITHUB_ENV 的值，因此这里直接用 matrix 计算。
      ARTIFACT: pcmannager-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
      # 版本号必须显式传入：workflow_dispatch 时没有 tag，git describe 会退化成
      # 短 SHA；GITHUB_REF_NAME 在 tag 触发时就是 tag 名（如 v1.2.3）。
      # scripts/build.sh 用它 -X 注入 internal/app.Version，面板与 /api/state
      # 显示的就是这个值，也是自动更新比较的基准。
      PCM_VERSION: ${{ github.ref_name }}
    steps:
      # 仓库通过 submodule 引入 reference/ 下的第三方参考仓库，必须递归拉取。
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: go mod tidy
        run: go mod tidy

      - name: gofmt check
        run: |
          set -euo pipefail
          # 排除 submodule 参考代码 reference/；只检查工作区中真实存在的 .go 文件
          mapfile -t files < <(git ls-files '*.go' | grep -v '^reference/' || true)
          existing=()
          for f in "${files[@]:-}"; do
            [ -n "${f}" ] && [ -f "${f}" ] && existing+=("${f}")
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "no go files to check"
            exit 0
          fi
          unformatted=$(gofmt -l "${existing[@]}")
          if [ -n "${unformatted}" ]; then
            echo "::error::以下文件未通过 gofmt，请运行 gofmt -w 后重新提交："
            echo "${unformatted}"
            exit 1
          fi
          echo "gofmt check passed (${#existing[@]} files)"

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          # 统一走 scripts/build.sh，避免 CI 与本地参数漂移。
          # 该脚本对 Windows 追加 -H windowsgui，否则启动会弹出黑色控制台窗口；
          # 并读取 PCM_VERSION（上面已设为 GITHUB_REF_NAME）注入 app.Version。
          bash scripts/build.sh "${GOOS}" "${GOARCH}" "${ARTIFACT}"
          ls -l "${ARTIFACT}"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: list artifacts
        run: |
          ls -l artifacts
          count=$(find artifacts -maxdepth 1 -type f | wc -l)
          echo "artifact count: ${count}"
          if [ "${count}" -ne 4 ]; then
            echo "::error::预期 4 个产物，实际 ${count} 个"
            exit 1
          fi

      - name: publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
