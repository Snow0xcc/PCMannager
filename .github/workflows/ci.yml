# 持续集成：推送到 main 或发起 PR 时运行。
#
# 与 release.yml 的分工：
#   - 本文件：每次 push/PR 的快速门槛——lint、单测、四平台可编译性。
#   - release.yml：打 tag 时才跑的发布流程（含产物上传与 GitHub Release）。
#
# 抽出来是因为 release.yml 只由 v* tag 触发；没有它，普通提交不会跑任何
# 检查，问题会积累到打 tag 时才集中爆发。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint (emoji 约束)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # 客户端界面禁用 emoji（项目硬约束）：新增前端后必须仍然通过。
      - name: emoji check
        run: bash scripts/check-emoji.sh

  test:
    name: test (go test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true
      - name: go test
        run: go test -race -count=1 ./internal/... ./modules/...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true
      # 编译验证走统一脚本：与发布同源参数，Windows 必须带 -H windowsgui。
      # 版本号用固定占位——此 job 只验证可编译性，产物不发布。
      - name: build
        run: |
          bash scripts/build.sh "${GOOS}" "${GOARCH}" "pcm-${GOOS}-${GOARCH}"
          ls -l "pcm-${GOOS}-${GOARCH}"

  vet:
    name: vet + gofmt + 品牌资源
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          set -euo pipefail
          # 排除 submodule 参考代码 reference/；只检查工作区中真实存在的 .go 文件。
          mapfile -t files < <(git ls-files '*.go' | grep -v '^reference/' || true)
          existing=()
          for f in "${files[@]:-}"; do
            [ -n "${f}" ] && [ -f "${f}" ] && existing+=("${f}")
          done
          if [ "${#existing[@]}" -eq 0 ]; then
            echo "no go files to check"
            exit 0
          fi
          unformatted=$(gofmt -l "${existing[@]}")
          if [ -n "${unformatted}" ]; then
            echo "::error::以下文件未通过 gofmt，请运行 gofmt -w 后重新提交："
            echo "${unformatted}"
            exit 1
          fi
          echo "gofmt check passed (${#existing[@]} files)"

      # 品牌资源必须与 internal/logo 的几何同源：改了几何却忘了重新生成，
      # 文档上的蝴蝶就会和托盘图标不一致——在这里拦下。
      - name: brand assets check
        run: bash scripts/gen-logo.sh --check

  tray-dbus:
    # Linux 托盘只在真实 D-Bus 会话总线上才能验证：单测覆盖不到对象导出、信号、
    # 向 StatusNotifierWatcher 注册、dbusmenu 往返与角标 NewIcon。测试会自己拉一个
    # 专用 dbus-daemon，不依赖桌面环境；PCM_REQUIRE_DBUS=1 让“跳过”变成失败，
    # 避免出现“绿灯只是因为没执行”。
    name: tray (linux dbus 集成)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true
      - name: install dbus
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus
          dbus-daemon --version | head -1
      - name: go test (tray dbus)
        env:
          PCM_REQUIRE_DBUS: '1'
        run: go test -count=1 -v -run 'TestLinuxTrayDBus' ./internal/tray/
